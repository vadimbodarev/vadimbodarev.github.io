<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murmuration — Interactive Bird Flock</title>
  <meta name="description" content="Interactive 3D bird flock simulation that follows your cursor in real-time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Interactive Canvas for 3D Bird Flock -->
  <canvas id="flock-canvas"></canvas>

  <!-- Minimalist Floating UI Overlay -->
  <div class="ui-layer">
    <header class="top-nav">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-title">AETHER FLOCK</span>
      </div>

      <div class="stats-pill">
        <span id="bird-count-label">180 Păsări</span>
        <span class="divider">•</span>
        <span id="mode-label">Urmărire Cursor</span>
      </div>
    </header>

    <main class="hero-center" id="hero-card">
      <p class="subtitle">SIMULARE INTERACTIVĂ ÎN TIMP REAL</p>
      <h1 class="main-heading">Zbor în Armonie</h1>
      <p class="description">
        Mișcă cursorul pe ecran — stolul de păsări te va urma organic. Apasă click pentru a crea un impuls de dispersie.
      </p>
    </main>

    <footer class="bottom-controls">
      <div class="control-group">
        <button class="ctrl-btn active" data-theme="twilight" id="btn-twilight">Amurg</button>
        <button class="ctrl-btn" data-theme="dawn" id="btn-dawn">Zori Aurii</button>
        <button class="ctrl-btn" data-theme="midnight" id="btn-midnight">Noapte</button>
      </div>

      <div class="control-group">
        <button class="ctrl-btn" id="btn-scatter" title="Risipește stolul">
          <span>Impuls (Click)</span>
        </button>
        <button class="ctrl-btn" id="btn-toggle-ui" title="Ascunde/Arată textul">
          <span>Ascunde Text</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
